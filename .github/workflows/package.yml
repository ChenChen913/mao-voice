name: Package

# v5.18：PyInstaller 打包——打 tag（v*）或手动触发时构建 Windows exe，
# 产物上传为 artifact；tag 触发时额外发布到 GitHub Release。
# 注意：首次真实运行前该工作流未在 CI 验证过，失败请看 Actions 日志调整。

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r voice_ime/requirements.txt
          pip install pyinstaller

      - name: Build exe (CPU 版，CI 不含 CUDA 运行库)
        run: python packaging/build_exe.py --cpu-only

      - name: Smoke test (启动 exe 并确认进程存活)
        run: |
          Start-Process -FilePath "dist/mao-voice/mao-voice.exe"
          Start-Sleep -Seconds 15
          $p = Get-Process -Name "mao-voice" -ErrorAction SilentlyContinue
          if (-not $p) { throw "mao-voice.exe 启动后进程不存在（崩溃）" }
          Stop-Process -Name "mao-voice" -Force

      - name: Zip dist
        run: |
          Compress-Archive -Path "dist/mao-voice" -DestinationPath "mao-voice-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mao-voice-windows-x64
          path: mao-voice-windows-x64.zip

      - name: Attach to GitHub Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mao-voice-windows-x64.zip
