name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r voice_ime/requirements.txt
          pip install pytest
      - name: Compile check
        run: python -m compileall -q voice_ime
      - name: Run unit tests
        run: python -m pytest voice_ime/tests -q --ignore=voice_ime/tests/run_safe_inject_test.py --ignore=voice_ime/tests/target_window.py

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
